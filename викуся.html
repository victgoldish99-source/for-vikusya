<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викуся, ты справляешься</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 50%, #c2e9fb 100%);
    background-size: 200% 200%;
    animation: gradientShift 15s ease infinite;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    color: #4a3f6b;
    padding: 20px;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 1;
  }
  .blob1 { width: 400px; height: 400px; background: #ffd6e8; top: -100px; left: -100px; animation: float1 20s ease-in-out infinite; }
  .blob2 { width: 350px; height: 350px; background: #d6e4ff; bottom: -80px; right: -80px; animation: float2 25s ease-in-out infinite; }
  .blob3 { width: 300px; height: 300px; background: #ffe8cc; top: 40%; left: 60%; animation: float3 22s ease-in-out infinite; }
  @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 80px); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-70px, -50px); } }
  @keyframes float3 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, 60px); } }

  .container {
    text-align: center;
    z-index: 10;
    padding: 20px;
    max-width: 620px;
    width: 100%;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 12px;
    font-weight: 400;
    letter-spacing: 0.5px;
    color: #5b4a7e;
    text-shadow: 0 2px 20px rgba(255, 255, 255, 0.6);
  }

  .subtitle {
    color: #7a6a9e;
    margin-bottom: 40px;
    font-size: 1em;
    line-height: 1.6;
  }

  .support-btn {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 30% 30%, #ffffff, #fbc2eb, #a6c1ee);
    box-shadow:
      0 0 0 0 rgba(251, 194, 235, 0.7),
      0 15px 50px rgba(166, 193, 238, 0.5),
      inset 0 -8px 20px rgba(122, 106, 158, 0.15),
      inset 0 8px 20px rgba(255, 255, 255, 0.8);
    font-size: 1em;
    color: #5b4a7e;
    font-family: inherit;
    font-weight: 500;
    transition: transform 0.2s ease;
    animation: pulse 3s infinite;
    z-index: 10;
  }
  .support-btn:hover { transform: scale(1.06); }
  .support-btn:active { transform: scale(0.94); }
  .support-btn .emoji { display: block; font-size: 2.6em; margin-bottom: 4px; }

  @keyframes pulse {
    0%, 100% {
      box-shadow:
        0 0 0 0 rgba(251, 194, 235, 0.7),
        0 15px 50px rgba(166, 193, 238, 0.5),
        inset 0 -8px 20px rgba(122, 106, 158, 0.15),
        inset 0 8px 20px rgba(255, 255, 255, 0.8);
    }
    50% {
      box-shadow:
        0 0 0 30px rgba(251, 194, 235, 0),
        0 15px 60px rgba(166, 193, 238, 0.7),
        inset 0 -8px 20px rgba(122, 106, 158, 0.15),
        inset 0 8px 20px rgba(255, 255, 255, 0.8);
    }
  }

  .quote-card {
    margin-top: 40px;
    padding: 35px 30px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 20px 50px rgba(166, 193, 238, 0.35);
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .quote-card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .quote-text {
    font-size: 1.2em;
    line-height: 1.7;
    color: #5b4a7e;
    font-weight: 400;
  }

  .quote-signature {
    margin-top: 18px;
    font-size: 0.9em;
    color: rgba(91, 74, 126, 0.7);
    font-style: italic;
  }

  .counter {
    margin-top: 25px;
    font-size: 0.9em;
    color: rgba(91, 74, 126, 0.6);
    min-height: 20px;
    transition: all 0.3s ease;
  }

  .float-up {
    position: fixed;
    font-size: 1.8em;
    pointer-events: none;
    z-index: 100;
    animation: flyUp 3s ease-out forwards;
    opacity: 0.9;
  }
  @keyframes flyUp {
    0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.2) rotate(var(--r)); }
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="container">
  <h1>Викуся, ты справляешься</h1>
  <p class="subtitle">Нажми на кнопку, когда станет тяжело.<br>Здесь всегда найдётся что-то для тебя.</p>

  <button class="support-btn" onclick="showQuote()">
    <span class="emoji">💛</span>
    Нажми

  </div>

  function createParticle() {
    const el = document.createElement('div');
    el.className = 'float-up';
    el.textContent = ['💛','✨','🌸','🌿','💫','🤍','🌷'][Math.floor(Math.random()*7)];

    const btn = document.querySelector('.support-btn');
    const rect = btn.getBoundingClientRect();
    el.style.left = (rect.left + rect.width/2) + 'px';
    el.style.top = (rect.top + rect.height/2) + 'px';

    const angle = Math.random() * Math.PI * 2;
    const distance = Math.random() * 250 + 150;
    el.style.setProperty('--x', Math.cos(angle) * distance + 'px');
    el.style.setProperty('--y', (Math.sin(angle) * distance - 200) + 'px');
    el.style.setProperty('--r', (Math.random() - 0.5) * 500 + 'deg');

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3100);
  }

  function getCount() {
    return parseInt(localStorage.getItem('support_count') || '0', 10);
  }
  function incrementCount() {
    const n = getCount() + 1;
    localStorage.setItem('support_count', n);
    return n;
  }
  function updateCounterDisplay(count) {
    const el = document.getElementById('counter');
    if (!el) return;
    if (count === 0) {
      el.textContent = '';
    } else if (count === 1) {
      el.textContent = 'Ты открыла это 1 раз 🌷';
    } else {
      el.textContent = `Ты открывала это ${count} раз 🌷`;
    }
  }

  let lastIndex = -1;

  function showQuote() {
    const card = document.getElementById('quoteCard');
    const text = document.getElementById('quoteText');

    let idx;
    do {
      idx = Math.floor(Math.random() * quotes.length);
    } while (idx === lastIndex && quotes.length > 1);
    lastIndex = idx;

    card.classList.remove('show');
    setTimeout(() => {
      text.textContent = quotes[idx];
      card.classList.add('show');
    }, 200);

    for (let i = 0; i < 12; i++) {
      setTimeout(() => createParticle(), i * 60);
    }

    if (navigator.vibrate) navigator.vibrate([40, 30, 40]);

    const newCount = incrementCount();
    updateCounterDisplay(newCount);
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateCounterDisplay(getCount());
  });
</script>
</body>
</html>
